[package]
name = "mywaker"
version = "0.15.0"
edition = "2024"
rust-version = "1.88"
description = "Run a team of AI employees backed by OpenCode from your terminal"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1"
color-eyre = "0.6"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
config = "0.15"
toml = "0.8"
dirs = "6"
humantime = "2"
serde_json = "1.0.154"
base64 = "0.23.1"
async-stream = "0.3.6"
reqwest = { version = "0.13.5", features = ["json", "stream", "rustls"], default-features = false }
sysinfo = "0.38.4"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
tokio-cron-scheduler = "0.15.1"
notify = "8.2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
axum = "0.8.9"
